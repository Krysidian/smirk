site_name: SMIRK - Freeform Facial Features
site_url: https://krysidian.github.io/smirk/
repo_url: https://github.com/Krysidian/smirk
theme:
  name: material
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
   logo: custom/smirk-big
  favicon: assets/images/smirk.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - navigation.footer
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes 
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: black
      accent: yellow

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: black
      accent: yellow

plugins:
  - search
  #- typeset
  - callouts:
      aliases: true 
      breakless_lists: true 
      title_from_first_bold: false  
  - glightbox:
       touchNavigation: true
       loop: false
       effect: zoom
       slide_effect: slide
       width: 100%
       height: auto
       zoomable: true
       draggable: true
       skip_classes:
         - custom-skip-class-name
       auto_themed: false
       auto_caption: false
       caption_position: bottom
       background: white
       shadow: true
       manual: false

extra:
  generator: false
  social:
    - icon: fontawesome/brands/twitter
      link: https://x.com/krysidian
    - icon: simple/bluesky
      link: https://bsky.app/profile/krysidian.bsky.social
    - icon: simple/youtube
      link: https://www.youtube.com/@krysidian

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - toc:
      permalink: false
      title: Table of contents
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - def_list

nav:
  - Home: index.md
  - Setup:
    - setup/index.md
    - setup/detached-facial-features.md
    - setup/grease-pencil-features.md
    - setup/ribbon-features.md
  - Core Concepts:
    - core-concepts/index.md
    - Freeform Facial Features: core-concepts/freeform-facial-features.md
    - Surface Object: core-concepts/surface-object.md
    - Cutter: core-concepts/cutter.md
    - Mask: core-concepts/mask.md
    - Modifier: core-concepts/modifier.md
  - Nodes:
    - nodes/index.md
    - Geometry Nodes:
      - SMIRK Modifier: nodes/smirk-mod.md
      - Override Layer Material: nodes/override-layer-material.md
    - Shader Nodes:
      - Transparency Mask: nodes/transparency-mask.md
    - Coming Soon:
      - SMIRK Meld: nodes/smirk-meld.md
      - Surface Deform Shrinkwrap: nodes/surface-deform-shrinkwrap.md
  - Support: support.md